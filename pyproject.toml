[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[project]
name = "frplib"
dynamic = ["version"]
description = 'A library for building, manipulating, and calculating with FRPs and their kinds, and an executable application for sampling large collections of FRPs of an arbitrary kind. This is primarily designed for instructional purposes in the teaching of probability theory and statistical modeling.'
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["probability", "statistics", "instruction"]
authors = [
  { name = "Christopher R. Genovese", email = "genovese@cmu.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click >= 8.1.4",
  "parsy >= 2.1",
  "pillow >= 10.1",
  "prompt-toolkit >= 3.0.43",
  "ptpython == 3.0.32",
  "Pygments >= 2.12.0",
  "rich >= 13.3.2",
  "platformdirs >= 4.0.0",
  "tomli >= 2.0.0; python_version < '3.11'",
  "typing_extensions >= 4.5.0",
  "scipy >= 1.13.0",
  "numpy >= 1.25.2",
]

[project.optional-dependencies]
dev = ["black", "ruff", "pytest", "hypothesis", "returns"]

[project.urls]
Homepage = "https://github.com/genovese/frplib"
Documentation = "https://github.com/genovese/frplib#readme"
Issues = "https://github.com/genovese/frplib/issues"
Source = "https://github.com/genovese/frplib"

[project.scripts]
frp = "frplib.cli:frp"

[tool.mypy]
plugins = []
allow_redefinition = false
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
local_partial_types = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
enable_incomplete_feature = ["Unpack"]

[tool.hatch.version]
path = "src/frplib/__about__.py"

[tool.hatch.build]
# frplib/data/info_tree.py is gitignored and regenerated by the info-tree
# build hook below; without this it would be silently excluded from built
# artifacts as a .gitignore match.
artifacts = ["src/frplib/data/info_tree.py"]

[tool.hatch.build.hooks.custom]
# The exact set of third-party packages frplib.repls.info needs importable to
# run (see hatch_build.py) -- listed explicitly, rather than pulling in all of
# frplib's runtime dependencies via require-runtime-dependencies, since e.g.
# numpy/scipy/pillow aren't needed just to regenerate this one data file.
dependencies = ["prompt-toolkit>=3.0.43", "rich>=13.3.2", "platformdirs>=4.0.0", "typing_extensions>=4.5.0"]

[tool.hatch.envs.default]
installer = "uv"
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
  "hypothesis",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.hatch.envs.all]
installer = "uv"
[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.lint]
detached = true
installer = "uv"
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/frplib tests}"
style = [
  "ruff {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

[tool.pylint.design]
max-returns = 10
max-args = 10
max-positional-arguments = 7
max-locals = 16
max-attributes = 10
max-statements = 75
min-public-methods = 0
max-bool-expr = 8

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # My ignores
  "E501", "N999", # Ruff doesn't support "E241", "E272", "E302", "E305", "W504",
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]

unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.pylint]
max-returns = 10

[tool.ruff.isort]
known-first-party = ["frplib"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["frplib", "tests"]
branch = true
parallel = true
omit = [
  "src/frplib/__about__.py",
]

[tool.coverage.paths]
frplib = ["src/frplib", "*/frplib/src/frplib"]
tests = ["tests", "*/frplib/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
